<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="yt.css" type="text/css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-left">
                <div class="menu-icon">&#9776;</div>
                <a class="logo-text" href="#">YouTube</a>
            </div>
            <div class="header-center">
                <input type="search" placeholder="Search" class="search-input">
                <button class="search-btn">🔍</button>
            </div>
            <div class="header-right">
                <button class="upload-btn">⬆ Upload</button>
                <div class="user-avatar">👤</div>
            </div>
        </header>

        <!-- Sidebar Section -->
        <aside class="sidebar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Trending</a></li>
                <li><a href="#">Subscriptions</a></li>
                <li><a href="#">Library</a></li>
                <li><a href="#">History</a></li>
            </ul>
        </aside>

        <!-- Main Content Section -->
        <main class="main-content">
            <div class="video-grid">
                <div class="video-card">
                    <div class="video-thumbnail"></div>
                    <div class="video-details">
                        <div class="video-title">Video Title 1</div>
                        <div class="video-meta">Channel Name • 1M views • 2 days ago</div>
                    </div>
                </div>
                <div class="video-card">
                    <div class="video-thumbnail"></div>
                    <div class="video-details">
                        <div class="video-title">Video Title 2</div>
                        <div class="video-meta">Channel Name • 500K views • 3 days ago</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
